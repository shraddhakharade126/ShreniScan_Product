<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Navy Blue Background Tile -->
  <rect width="512" height="512" fill="#10263f" />

  <g transform="translate(0, 0) scale(1)">
    <!-- ======================================================== -->
    <!-- 1. OUTER ORNATE FRAME & BORDER                           -->
    <!-- ======================================================== -->
    <!-- Main Outer Border with Notched / Scalloped Corners -->
    <path d="M 54 82
             C 54 66, 66 54, 82 54
             L 430 54
             C 446 54, 458 66, 458 82
             L 458 430
             C 458 446, 446 458, 430 458
             L 82 458
             C 66 458, 54 446, 54 430 Z"
          fill="none" stroke="#f7f2e7" stroke-width="4.5" stroke-linejoin="round" />

    <!-- Secondary Inset Frame -->
    <path d="M 64 90
             C 64 76, 76 64, 90 64
             L 422 64
             C 436 64, 448 76, 448 90
             L 448 422
             C 448 436, 436 448, 422 448
             L 90 448
             C 76 448, 64 436, 64 422 Z"
          fill="none" stroke="#f7f2e7" stroke-width="2" opacity="0.8" />

    <!-- ======================================================== -->
    <!-- 2. FOUR CORNER FLORAL PALMETTES & MANDALA MOTIFS         -->
    <!-- ======================================================== -->
    <g id="corner-medallion">
      <!-- Outer corner flourish triangle & curls -->
      <path d="M 28 28 L 52 28 L 28 52 Z" fill="#f7f2e7" />
      <circle cx="36" cy="36" r="3.5" fill="#10263f" />
      <path d="M 38 46 C 44 40, 52 40, 58 46" stroke="#f7f2e7" stroke-width="2" fill="none" />
      <path d="M 46 38 C 40 44, 40 52, 46 58" stroke="#f7f2e7" stroke-width="2" fill="none" />

      <!-- Corner Inset Floral Spray -->
      <!-- Center diagonal petal pointing towards cartouche -->
      <path d="M 76 76 C 96 66, 120 70, 134 88 C 116 102, 102 116, 76 76 Z" fill="#f7f2e7" />
      <circle cx="86" cy="86" r="5" fill="#10263f" />
      <circle cx="106" cy="106" r="3.5" fill="#f7f2e7" />

      <!-- Flanking Lotus Petals -->
      <path d="M 72 118 C 86 102, 106 108, 112 130 C 92 130, 80 125, 72 118 Z" fill="#f7f2e7" />
      <path d="M 118 72 C 102 86, 108 106, 130 112 C 130 92, 125 80, 118 72 Z" fill="#f7f2e7" />
      
      <!-- Outer tendrils & buds -->
      <path d="M 80 148 C 94 136, 104 142, 100 156" stroke="#f7f2e7" stroke-width="2" fill="none" />
      <circle cx="74" cy="142" r="3.5" fill="#f7f2e7" />
      <circle cx="102" cy="162" r="3" fill="#f7f2e7" />

      <path d="M 148 80 C 136 94, 142 104, 156 100" stroke="#f7f2e7" stroke-width="2" fill="none" />
      <circle cx="142" cy="74" r="3.5" fill="#f7f2e7" />
      <circle cx="162" cy="102" r="3" fill="#f7f2e7" />
    </g>

    <!-- 4 Corners via symmetry -->
    <use href="#corner-medallion" transform="translate(512, 0) scale(-1, 1)" />
    <use href="#corner-medallion" transform="translate(0, 512) scale(1, -1)" />
    <use href="#corner-medallion" transform="translate(512, 512) scale(-1, -1)" />

    <!-- ======================================================== -->
    <!-- 3. TOP, BOTTOM, LEFT, RIGHT CRESTS (Side Palmettes)      -->
    <!-- ======================================================== -->
    <g id="edge-palmette">
      <!-- Main upright lotus petal / droplet -->
      <path d="M 256 56 C 247 72, 244 88, 256 106 C 268 88, 265 72, 256 56 Z" fill="#f7f2e7" />
      <circle cx="256" cy="116" r="3.5" fill="#f7f2e7" />

      <!-- Left curving petal -->
      <path d="M 244 76 C 228 78, 216 92, 224 108 C 238 104, 244 92, 244 76 Z" fill="#f7f2e7" />
      <circle cx="212" cy="98" r="3.5" fill="#f7f2e7" />

      <!-- Right curving petal -->
      <path d="M 268 76 C 284 78, 296 92, 288 108 C 274 104, 268 92, 268 76 Z" fill="#f7f2e7" />
      <circle cx="300" cy="98" r="3.5" fill="#f7f2e7" />

      <!-- Flanking scroll tendrils -->
      <path d="M 204 88 C 196 98, 198 106, 210 108" stroke="#f7f2e7" stroke-width="2" fill="none" />
      <path d="M 308 88 C 316 98, 314 106, 302 108" stroke="#f7f2e7" stroke-width="2" fill="none" />
    </g>

    <!-- 4 Edges via symmetry -->
    <use href="#edge-palmette" transform="translate(0, 512) scale(1, -1)" />
    <use href="#edge-palmette" transform="translate(0, 512) rotate(-90)" />
    <use href="#edge-palmette" transform="translate(512, 0) rotate(90)" />

    <!-- ======================================================== -->
    <!-- 4. OUTER SCALLOPED ROSETTE / MEDALLION RING              -->
    <!-- ======================================================== -->
    <path d="M 256 122
             C 288 122, 318 142, 334 168
             C 360 184, 380 214, 380 246
             C 380 256, 388 266, 396 256
             C 388 246, 380 256, 380 266
             C 380 298, 360 328, 334 344
             C 318 370, 288 390, 256 390
             C 224 390, 194 370, 178 344
             C 152 328, 132 298, 132 266
             C 132 234, 152 204, 178 188
             C 194 162, 224 122, 256 122 Z"
          fill="none" stroke="#f7f2e7" stroke-width="2.5" opacity="0.6" stroke-dasharray="6 6" />

    <!-- Diagonal Quadrant Spandrel Leaves (Between Cartouche & Corners) -->
    <g id="spandrel-floral">
      <path d="M 338 172 C 358 158, 380 164, 394 184 C 374 196, 356 190, 338 172 Z" fill="#f7f2e7" />
      <circle cx="372" cy="168" r="4" fill="#f7f2e7" />
      <path d="M 360 134 C 370 144, 372 154, 348 162" stroke="#f7f2e7" stroke-width="2.5" fill="none" />
      <circle cx="378" cy="144" r="3" fill="#f7f2e7" />
    </g>
    <!-- 4 Quadrants -->
    <use href="#spandrel-floral" transform="translate(512, 0) scale(-1, 1)" />
    <use href="#spandrel-floral" transform="translate(0, 512) scale(1, -1)" />
    <use href="#spandrel-floral" transform="translate(512, 512) scale(-1, -1)" />

    <!-- ======================================================== -->
    <!-- 5. CENTRAL QUATREFOIL CARTOUCHE                          -->
    <!-- Distinct 4-lobed medallion with indented cusps           -->
    <!-- ======================================================== -->
    <!-- Outer Cartouche Stroke -->
    <path d="M 256 136
             C 292 136, 324 162, 330 196
             C 354 202, 376 226, 376 256
             C 376 286, 354 310, 330 316
             C 324 350, 292 376, 256 376
             C 220 376, 188 350, 182 316
             C 158 310, 136 286, 136 256
             C 136 226, 158 202, 182 196
             C 188 162, 220 136, 256 136 Z"
          fill="none" stroke="#f7f2e7" stroke-width="5" stroke-linejoin="round" />

    <!-- Inner Echo Line -->
    <path d="M 256 146
             C 286 146, 314 168, 320 198
             C 342 204, 364 226, 364 256
             C 364 286, 342 308, 320 314
             C 314 344, 286 366, 256 366
             C 226 366, 198 344, 192 314
             C 170 308, 148 286, 148 256
             C 148 226, 170 204, 192 198
             C 198 168, 226 146, 256 146 Z"
          fill="none" stroke="#f7f2e7" stroke-width="1.8" opacity="0.85" />

    <!-- ======================================================== -->
    <!-- 6. THE CENTRAL MASTER DEVANAGARI GLYPH: "श्रे" (Shre)    -->
    <!-- Handcrafted artisan calligraphy with precise proportions -->
    <!-- ======================================================== -->
    <g id="devanagari-shre">
      <!-- A. Top Horizontal Header Bar (Shirorekha) -->
      <!-- Spans from x=214 to x=334, y=202 to y=218 (16px thickness) -->
      <rect x="214" y="202" width="124" height="16" rx="2" fill="#f7f2e7" />

      <!-- B. Vertical Stem (Danda) on the right -->
      <!-- Runs from y=202 down to y=350 at x=304, width=17 -->
      <rect x="303" y="202" width="17" height="148" rx="2" fill="#f7f2e7" />

      <!-- C. E-matra ('े') on top-right of the vertical stem -->
      <!-- Slants upward and to the right from the shirorekha -->
      <path d="M 307 202
               C 310 180, 324 162, 342 152
               C 348 156, 345 166, 334 174
               C 325 182, 321 192, 319 202 Z"
            fill="#f7f2e7" />

      <!-- D. Circular Loop & Head of 'श' -->
      <!-- Elegant circular loop with a centered inner negative space -->
      <!-- Outer circle radius 26, inner cut radius 11 -->
      <path d="M 264 218
               C 246 218, 220 226, 210 242
               C 198 260, 202 282, 218 294
               C 234 304, 256 298, 266 282
               C 274 270, 272 252, 262 240
               C 254 230, 242 226, 232 228
               C 222 230, 216 240, 218 250
               C 220 260, 232 266, 242 262
               C 252 258, 254 246, 248 238
               C 242 232, 234 234, 230 238"
            fill="none" stroke="#f7f2e7" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

      <!-- E. Lower Diagonal Leg of 'श' -->
      <!-- Extends from the base of the loop down-leftwards -->
      <!-- From (238, 282) to (182, 338), width=17 -->
      <path d="M 238 282 
               L 182 338" 
            stroke="#f7f2e7" stroke-width="17" stroke-linecap="round" />

      <!-- F. Ra-kar ('्र') Diagonal Conjunct Stroke -->
      <!-- Extends from the vertical stem down-leftwards -->
      <!-- From (308, 274) to (220, 348), width=17 -->
      <!-- Perfectly parallel to the leg of 'श' -->
      <path d="M 308 274 
               L 220 348" 
            stroke="#f7f2e7" stroke-width="17" stroke-linecap="round" />
    </g>
  </g>
</svg>